allowBuilds:
  # Unpacks the workerd binary `wrangler dev` runs the Worker on locally.
  workerd: true
  # The platform-specific esbuild binary Astro and wrangler bundle with.
  esbuild: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260926.1'
  - miniflare@5.20260925.0-alpha
  - wrangler@4.141.0
